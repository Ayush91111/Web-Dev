<!DOCTYPE html>
<html>
<head>
  <title>Task 1 - Callback</title>
</head>
<body>
<script>
function getUser(id, callback) {
    setTimeout(() => {
        callback({ id: id, name: "Ram" });
    }, 2000);
}

getUser(1, function(user) {
    console.log("User name:", user.name);
});
</script>
</body>
</html>
