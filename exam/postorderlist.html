<!DOCTYPE html>
<html>
<head>
    <title>Posts</title>
</head>
<body>

<h1>Posts</h1>
<div id="loading">Please wait, loading data...</div>
<div id="error" style="color:red; display:none;">Failed to load data</div>
<ol id="posts-list"></ol>

<script>
const apiURL = "https://jsonplaceholder.typicode.com/posts";

fetch(apiURL)
    .then(res => res.json())
    .then(posts => {
        document.getElementById("loading").style.display = "none";
        const list = document.getElementById("posts-list");
        posts.forEach(post => {
            const li = document.createElement("li");
            li.innerHTML = `<strong>${post.title}</strong><br>${post.body}`;
            list.appendChild(li);
        });
    })
    .catch(err => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
    });
</script>

</body>
</html>
